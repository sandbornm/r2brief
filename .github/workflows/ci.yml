name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    name: Installer parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
      - name: Clean-checkout install and smoke
        env:
          R2B_FLAVOR: core
        run: ./scripts/install.sh
      - name: Activated command parity
        run: |
          source .venv/bin/activate
          r2b --version
          r2b env --json > "$RUNNER_TEMP/env.json"
          python -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/env.json"

  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/frontend/.nvmrc
      - name: Install backend
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check src tests
      - name: Typed public core
        run: uv run ty check src/r2b/api.py src/r2b/bundle.py src/r2b/analysis/provenance.py src/r2b/analysis/review.py
      - name: Validate JSON schemas
        run: |
          python scripts/corpus_intake.py list
          python -m json.tool schemas/analysis_bundle.schema.json > /dev/null
          python -m json.tool schemas/analysis_record.schema.json > /dev/null
          python -m json.tool schemas/artifact_dag.schema.json > /dev/null
          python -m json.tool schemas/briefing.schema.json > /dev/null
          python -m json.tool schemas/review.schema.json > /dev/null
          python -m json.tool schemas/review-set.schema.json > /dev/null
          python -m json.tool schemas/pilot.schema.json > /dev/null
          python -m json.tool schemas/setup.schema.json > /dev/null
      - name: Pytest
        run: |
          uv run pytest tests/unit tests/integration/test_api.py::TestChatsEndpoint::test_chat_bundle_exports_json_and_markdown \
            --cov=r2b --cov-report=term --cov-fail-under=45
      - name: CLI smoke
        run: |
          uv run r2b --version
          uv run r2b env --json
          uv run r2b brief /bin/ls --quick --json > "$RUNNER_TEMP/brief.json"
          python -c "
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          schema = json.loads(pathlib.Path('schemas/briefing.schema.json').read_text())
          missing = [k for k in schema['required'] if k not in data]
          assert data.get('schema_version') == 'r2b.briefing.v1', data.get('schema_version')
          assert 'handoff' in data and 'next_argv' in data['handoff']
          assert 'ask' not in data['handoff']
          assert not missing, missing
          " "$RUNNER_TEMP/brief.json"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/frontend/.nvmrc
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  rust-stripped-eval:
    name: Stripped Rust eval (fd aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install aarch64 cross toolchain and rustc 1.93.0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup toolchain install 1.93.0 --profile minimal --target aarch64-unknown-linux-gnu
          echo "RUSTUP_TOOLCHAIN=1.93.0" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: rust-eval-registry-fd-10.5.2
      - name: Install backend
        run: |
          uv sync --locked --extra r2
          uv pip install --require-hashes -r scripts/rust_eval/requirements.txt
      - name: Build, rank and score
        run: scripts/rust_eval/run.sh "$RUNNER_TEMP/rust-eval" "$GITHUB_STEP_SUMMARY"
      - name: Upload eval binaries and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-eval-fd-aarch64
          path: |
            ${{ runner.temp }}/rust-eval/results.json
            ${{ runner.temp }}/rust-eval/bins/
            ${{ runner.temp }}/rust-eval/dataset/truth/
          if-no-files-found: ignore
          retention-days: 3

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [installer, backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/frontend/.nvmrc
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Build sdist and wheel
        run: |
          chmod +x scripts/package_release.sh
          SKIP_FRONTEND=1 ./scripts/package_release.sh
      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r2b-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
