name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Read version
        id: version
        run: |
          VERSION="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
          EXPECTED: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$TAG_NAME" != "$EXPECTED" ]; then
            echo "tag $TAG_NAME does not match pyproject version $EXPECTED" >&2
            exit 1
          fi

      - name: Install backend
        run: uv sync --locked
      - name: Backend checks
        run: |
          uv run ruff check src tests
          uv run ty check src/r2b/api.py src/r2b/bundle.py src/r2b/analysis/provenance.py src/r2b/analysis/review.py
          python -m json.tool schemas/analysis_bundle.schema.json > /dev/null
          python -m json.tool schemas/review.schema.json > /dev/null
          python -m json.tool schemas/review-set.schema.json > /dev/null
          python -m json.tool schemas/setup.schema.json > /dev/null
          uv run pytest tests/unit tests/integration/test_api.py::TestChatsEndpoint::test_chat_bundle_exports_json_and_markdown
          uv run r2b --version

      - name: Frontend checks
        working-directory: web/frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Package artifacts
        run: |
          chmod +x scripts/package_release.sh
          ./scripts/package_release.sh

      - name: Attest dist
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: r2b-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Packaged r2brief ${VERSION}. CLI and Python package are both \`r2b\`.

          ### Install
          \`\`\`bash
          uv pip install "r2b[r2] @ https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/r2b-${VERSION}-py3-none-any.whl"
          r2b --version
          \`\`\`

          From a clone at this tag: \`./scripts/install.sh\`

          Artifacts: wheel, sdist, frontend tarball, schemas/docs contract, \`install.sh\`, \`SHA256SUMS\`.
          EOF
          gh release create "$TAG_NAME" dist/* \
            --title "$TAG_NAME" \
            --notes-file "$notes" \
            --generate-notes
