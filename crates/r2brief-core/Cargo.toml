[package]
name = "r2brief-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Client-side ELF triage core for r2brief: structural anomaly checks, stripped function-boundary recovery, and r2b evidence bundles."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "r2brief-core"
path = "src/bin/r2brief-core.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
wasm-bindgen = { version = "0.2", optional = true }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
