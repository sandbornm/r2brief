<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 64" role="img" aria-label="r2brief">
  <title>r2brief</title>
  <rect width="64" height="64" rx="14" fill="#11100e"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" fill="none" stroke="#2c2a26" stroke-width="1.25"/>
  <path d="M11 18.2 L18 22.5 L11 26.8 Z" fill="#e97451"/>
  <rect x="22" y="16" width="30" height="7" rx="1.4" fill="#e4d4b4"/>
  <rect x="22" y="28.5" width="22" height="7" rx="1.4" fill="#c8a96a"/>
  <rect x="22" y="41" width="13" height="7" rx="1.4" fill="#8a7548"/>
  <!-- Stencil wordmark. 2 is 7-segment so it cannot read as 5. -->
  <g fill="#8a7548">
    <!-- r -->
    <g transform="translate(78 0)">
      <rect x="0" y="20" width="4.2" height="24" rx="0.7"/>
      <rect x="4" y="20" width="12.2" height="4.2" rx="0.7"/>
      <rect x="12" y="20" width="4.2" height="9.2" rx="0.7"/>
    </g>
    <!-- 2 -->
    <g transform="translate(102 0)">
      <rect x="0" y="20" width="16" height="4.2" rx="0.7"/>
      <rect x="11.8" y="20" width="4.2" height="13.2" rx="0.7"/>
      <rect x="0" y="31.8" width="16" height="4.2" rx="0.7"/>
      <rect x="0" y="31.8" width="4.2" height="12.2" rx="0.7"/>
      <rect x="0" y="39.8" width="16" height="4.2" rx="0.7"/>
    </g>
    <!-- b -->
    <g transform="translate(128 0)">
      <rect x="0" y="16" width="4.2" height="28" rx="0.7"/>
      <rect x="0" y="31.8" width="16" height="4.2" rx="0.7"/>
      <rect x="11.8" y="31.8" width="4.2" height="12.2" rx="0.7"/>
      <rect x="0" y="39.8" width="16" height="4.2" rx="0.7"/>
    </g>
    <!-- r -->
    <g transform="translate(154 0)">
      <rect x="0" y="20" width="4.2" height="24" rx="0.7"/>
      <rect x="4" y="20" width="12.2" height="4.2" rx="0.7"/>
      <rect x="12" y="20" width="4.2" height="9.2" rx="0.7"/>
    </g>
    <!-- i -->
    <g transform="translate(178 0)">
      <rect x="0" y="16" width="4.2" height="4.2" rx="0.7"/>
      <rect x="0" y="22.6" width="4.2" height="21.4" rx="0.7"/>
    </g>
    <!-- e: top + upper-right + left through bottom; no lower-right (not an 8/o) -->
    <g transform="translate(190 0)">
      <rect x="0" y="20" width="16" height="4.2" rx="0.7"/>
      <rect x="0" y="20" width="4.2" height="24" rx="0.7"/>
      <rect x="11.8" y="20" width="4.2" height="13.2" rx="0.7"/>
      <rect x="0" y="31.8" width="16" height="4.2" rx="0.7"/>
      <rect x="0" y="39.8" width="16" height="4.2" rx="0.7"/>
    </g>
    <!-- f: short top + hook, not a capital F -->
    <g transform="translate(216 0)">
      <rect x="0" y="16" width="4.2" height="28" rx="0.7"/>
      <rect x="0" y="16" width="11" height="4.2" rx="0.7"/>
      <rect x="8.8" y="16" width="4.2" height="7.2" rx="0.7"/>
      <rect x="0" y="31.8" width="11" height="4.2" rx="0.7"/>
    </g>
  </g>
</svg>
