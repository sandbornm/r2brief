[project]
name = "r2b"
version = "0.1.0"
description = "Binary triage CLI: ranked regions, SHA-256 records, optional LLM asks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "r2brief contributors" }]
dependencies = [
  "typer>=0.15,<1",
  "rich>=13.7,<14",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<0.28",
  "python-dotenv>=1.0,<2",
  "pyelftools>=0.29,<0.32",
  "pefile>=2024.8.26,<2027",
  "macholib>=1.16,<2",
]

[project.optional-dependencies]
# Default wheel is CLI-only (brief/verify/records). Analysis tools, Flask, and
# hosted LLM SDKs stay extras. `r2b setup` picks r2 | analyzers. Runtime
# instrumentation stays in the explicit `dynamic` extra.
r2 = [
  "r2pipe>=1.9.0,<2",
  "capstone>=5.0.1,<6",
  "python-magic>=0.4.27,<0.5",
]
symbolic = [
  "angr>=9.2,<10",
  "unicorn>=2.1,<3",
]
dynamic = [
  "frida>=16.0.0",
  "frida-tools>=12.0.0",
]
analyzers = [
  "r2pipe>=1.9.0,<2",
  "capstone>=5.0.1,<6",
  "python-magic>=0.4.27,<0.5",
  "angr>=9.2,<10",
  "unicorn>=2.1,<3",
]
llm = [
  "openai>=1.30,<2",
  "anthropic>=0.29,<1",
]
web = [
  "Flask>=3.0,<4",
  "flask-cors>=4.0,<5",
]
ghidra = [
  "ghidra-bridge>=1.0.0",
]
# Product extra for a wheel: brief + web + hosted --ask. Not angr.
std = [
  "r2pipe>=1.9.0,<2",
  "capstone>=5.0.1,<6",
  "python-magic>=0.4.27,<0.5",
  "openai>=1.30,<2",
  "anthropic>=0.29,<1",
  "Flask>=3.0,<4",
  "flask-cors>=4.0,<5",
]
[project.urls]
homepage = "https://github.com/sandbornm/r2brief"
repository = "https://github.com/sandbornm/r2brief"
changelog = "https://github.com/sandbornm/r2brief/blob/main/CHANGELOG.md"
releases = "https://github.com/sandbornm/r2brief/releases"

[project.scripts]
r2b = "r2b.cli:run"
r2b-web = "r2b.web.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2b"]

# Defaults + flavor tomls live in the wheel so `r2b setup` works without a clone.
# Destination is r2b/share/ — not r2b/config/, which would clash with config.py.
# Never bake config/local.toml (secrets / lab overlay).
[tool.hatch.build.targets.wheel.force-include]
"config/default_config.toml" = "r2b/share/default_config.toml"
"config/flavors/core.toml" = "r2b/share/flavors/core.toml"
"config/flavors/lab.toml" = "r2b/share/flavors/lab.toml"
"config/flavors/full.toml" = "r2b/share/flavors/full.toml"
"config/openrouter.example.toml" = "r2b/share/openrouter.example.toml"
"config/openai.example.toml" = "r2b/share/openai.example.toml"
"config/glm.example.toml" = "r2b/share/glm.example.toml"
"config/z.ai.example.toml" = "r2b/share/z.ai.example.toml"
"config/x.ai.example.toml" = "r2b/share/x.ai.example.toml"
"config/kimi.example.toml" = "r2b/share/kimi.example.toml"
"config/exo.example.toml" = "r2b/share/exo.example.toml"
"config/headless.example.toml" = "r2b/share/headless.example.toml"
"config/cloud_config.example.toml" = "r2b/share/cloud_config.example.toml"
"ghidra/extensions/r2b/scripts/DecompileTargets.java" = "r2b/share/ghidra/DecompileTargets.java"
"ghidra/extensions/r2b/scripts/R2BHeadless.java" = "r2b/share/ghidra/R2BHeadless.java"
"web/frontend/dist" = "r2b/web_dist"

[tool.hatch.build.targets.sdist]
# Keep the source archive deterministic. Local extract caches and node_modules
# must never land in a release tarball.
exclude = ["config/local.toml"]
# The production frontend is generated and gitignored, but a wheel built from
# this sdist still needs the exact payload produced by setup/package_release.
artifacts = ["web/frontend/dist/**"]
only-include = [
  "src/r2b",
  "tests",
  "schemas",
  "config",
  "scripts",
  "docs",
  "ghidra",
  "web/frontend/dist",
  "LICENSE",
  "NOTICE.md",
  "README.md",
  "CHANGELOG.md",
  "AGENTS.md",
  "pyproject.toml",
  "uv.lock",
]

[dependency-groups]
# Checkout default (`uv sync` / `uv run`). Not published.
# Keep the product pins in sync with extras r2 + web + llm / extra std.
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<0.24",
  "pytest-cov>=4.1,<5",
  "pytest-mock>=3.12,<4",
  "httpx>=0.27,<0.28",
  "ruff>=0.4.2,<0.5",
  "ty>=0.0.75,<1",
  "r2pipe>=1.9.0,<2",
  "capstone>=5.0.1,<6",
  "python-magic>=0.4.27,<0.5",
  "openai>=1.30,<2",
  "anthropic>=0.29,<1",
  "Flask>=3.0,<4",
  "flask-cors>=4.0,<5",
]

[tool.ruff]
line-length = 100

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external tools)",
    "slow: Slow tests that should be run less frequently",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/r2b"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
